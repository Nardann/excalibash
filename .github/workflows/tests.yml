name: Tests

on:
  push:
    branches: [master, experimental]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Agent
        working-directory: agent
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
          make dist

      - name: Serveur
        working-directory: server
        run: |
          npm ci
          npx tsc --noEmit -p .

      - name: Application web
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm run build
          npm run build:mcp

      # Noyau Jupyter de la machine de test (notebooks) ; Chrome est préinstallé sur les images ubuntu de GitHub.
      - name: Dépendances des tests
        run: python3 -m pip install --user ipykernel jupyter_client

      - name: Bout en bout (API puis navigateur réel)
        env:
          SHOTS_DIR: ${{ runner.temp }}/shots
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          ./tests/run.sh

      - name: Captures d'écran du navigateur (échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-navigateur
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Image Docker
        run: docker build -t excalibash:ci .
