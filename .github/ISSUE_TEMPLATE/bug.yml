name: Bug
description: Quelque chose ne marche pas comme prévu
labels: [bug]
body:
  - type: textarea
    id: probleme
    attributes:
      label: Le problème
      description: Ce qui se passe, et ce qui était attendu.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir un tableau
        2. Cliquer sur…
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit, tag ou date de l'image Docker.
  - type: input
    id: environnement
    attributes:
      label: Navigateur et système de la machine
      placeholder: Firefox 140, agent sur Debian 12 amd64
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Console du navigateur, `docker compose logs excalibash` ou sortie de l'agent. Retirer emails, adresses et tout code d'installation ou d'appairage."
      render: text
